services:
  postgres:
    image: postgres:17-alpine
    container_name: signalboard-postgres
    environment:
      POSTGRES_DB: lakewright
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakewright"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - signalboard-data:/var/lib/postgresql/data

volumes:
  signalboard-data:
