version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem cluster. Fifteen separate bumps a week is how
      # dependency updates stop being reviewed and start being rubber-stamped.
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']
      aspnetcore:
        patterns: ['Microsoft.AspNetCore.*']
      efcore:
        patterns: ['Microsoft.EntityFrameworkCore.*', 'Npgsql.*']
      test:
        patterns: ['xunit*', 'Testcontainers*', 'WireMock*', 'NSubstitute', 'Shouldly', 'Microsoft.Extensions.Diagnostics.Testing', 'Microsoft.Extensions.TimeProvider.Testing']

  # Pinned SHAs do not update themselves. Without this, hardening the workflows
  # means freezing them at whatever was current the day they were written.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Every github/codeql-action/* step has to move together. CodeQL refuses to run
      # when init, autobuild, analyze and upload-sarif are not all on the same version
      # -- "Loaded a configuration file for version X, but running version Y" -- so an
      # ungrouped bump opens one PR per sub-action, each of which fails on its own and
      # can only pass alongside the others. Grouped by pattern rather than update-type,
      # because that constraint holds for a major just as much as a patch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The sample's Dockerfile and compose file, which is where they live rather than at the root.
  # Pointed at / this watched nothing at all.
  - package-ecosystem: docker
    directory: /samples/Signalboard
    schedule:
      interval: weekly
      day: monday

  # The browser smoke test. Not part of CI, but Playwright pulls a browser and still deserves
  # patching.
  - package-ecosystem: npm
    directory: /tests/ui
    schedule:
      interval: monthly
