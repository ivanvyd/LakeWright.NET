name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A hung job is worse than a failed one: it holds a runner for GitHub's six-hour default and
# reports nothing. The test job wedged on `dotnet test` for over twenty minutes on 2026-08-05
# against a one-minute baseline, and had to be cancelled by hand. These caps are generous
# multiples of the observed times, so they fire on a hang and never on a slow runner.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      # Format is enforced by the build via EnforceCodeStyleInBuild. This catches
      # whitespace-only drift that the analyzers do not.
      - run: dotnet format --verify-no-changes --no-restore

      # Dependabot raises a PR; this fails the build. Without it a known-vulnerable
      # transitive package ships while the bump PR waits for review.
      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q -E '>\s+\S+\s+\S+\s+\S+\s+(Moderate|High|Critical)' vuln.txt && exit 1
          echo "no moderate-or-higher advisories"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # Testcontainers needs a Docker daemon; ubuntu-latest has one.
      # Live tests are excluded here and run only from a maintainer-triggered workflow.
      - run: dotnet test -c Release --filter "Category!=Live" --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      # Reported, not gated — the script says why. In scripts/ rather than inline here, so it can
      # be run and changed without a workflow round trip, like the two doc checks below.
      - name: Report coverage
        if: always()
        run: python3 scripts/report-coverage.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: TestResults/

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-doc-links.sh
      # Links rot first; claims rot quietly. A re-read on 2026-08-05 found six claims describing
      # a repository that had moved on without them, two in the compliance mapping an assessor
      # reads first and one in the threat model. Review found the sixth after this check was
      # written and passing, which is why its rules match the subject rather than the sentence.
      - run: bash scripts/check-doc-claims.sh

  # Its own required check, so a skipped or filtered-out isolation suite fails
  # the build instead of passing quietly inside the general test job.
  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "Category=TenantIsolation"

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
      # `bundle validate` resolves against a live workspace, so it needs credentials
      # that a fork PR must never receive. Forks get schema validation only; a
      # maintainer runs the authenticated validation before merge.
      # `bundle schema` only prints the schema, so it has to be fed to a validator
      # against the actual file to check anything.
      # No working-directory here: git does not track empty directories, so `databricks/`
      # does not exist in the checkout until the bundle does, and a working-directory that
      # does not exist fails the job before the guard below can run.
      - name: Validate bundle against schema (no credentials)
        run: |
          if [ ! -f databricks/databricks.yml ]; then
            echo "No bundle yet; nothing to validate."
            exit 0
          fi
          pipx install check-jsonschema
          databricks bundle schema > /tmp/bundle.schema.json
          check-jsonschema --schemafile /tmp/bundle.schema.json databricks/databricks.yml

      - name: Validate against workspace
        if: |
          hashFiles('databricks/databricks.yml') != ''
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "No workspace credentials configured; skipping authenticated validation."
            exit 0
          fi
          databricks bundle validate -t dev
