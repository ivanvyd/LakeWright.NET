name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

# Least privilege by default. Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A hung job is worse than a failed one: it holds a runner for GitHub's six-hour default and
# reports nothing. The test job wedged on `dotnet test` for over twenty minutes on 2026-08-05
# against a one-minute baseline, and had to be cancelled by hand. These caps are generous
# multiples of the observed times, so they fire on a hang and never on a slow runner.
jobs:
  # No candidate code executes until its current tree and every newly public
  # revision have passed the private denylist. External forks are scanned by the
  # trusted Confidentiality workflow and do not execute code in this workflow.
  confidentiality-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explain external-fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.actor != 'dependabot[bot]'
        run: echo "External fork code is not executed; the trusted Confidentiality workflow scans it as data."
      - name: Check out candidate source as data
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: candidate
      - name: Check out the trusted scanner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.event.before }}
          path: trusted
          persist-credentials: false
      - name: Verify repository-owner image review
        id: image-review
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize' && (github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]') && contains(github.event.pull_request.labels.*.name, 'confidentiality-image-reviewed')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" -f per_page=100 -f page=1 > timeline.json
          count=$(jq 'length' timeline.json)
          if [ "$count" -eq 100 ]; then
            gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" -f per_page=100 -f page=2 > timeline-page-2.json
            if [ "$(jq 'length' timeline-page-2.json)" -ne 0 ]; then
              echo "::error title=Metadata budget exceeded::The pull request has more than 100 timeline events."
              exit 1
            fi
          fi
          jq -e --arg label confidentiality-image-reviewed --arg owner "$REPOSITORY_OWNER" '
            [.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == $label)]
            | last
            | select(.event == "labeled" and .actor.login == $owner)
          ' timeline.json >/dev/null || {
            echo "::error title=Invalid image-review approval::Only the repository owner may apply the image-review approval label."
            exit 1
          }
          echo "allow_unreviewed_images=1" >> "$GITHUB_OUTPUT"
      - name: Test the confidentiality scanner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        working-directory: trusted
        run: python3 scripts/test-confidential-identifiers.py
      - name: Scan source and every newly public revision
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          # Pushes are merge results whose owner-only raster approval was enforced
          # on the required pull-request checks. Main has no direct-push bypass.
          CONFIDENTIAL_ALLOW_UNREVIEWED_IMAGES: ${{ github.event_name == 'push' && '1' || steps.image-review.outputs.allow_unreviewed_images }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          OSS_CONFIDENTIAL_TERMS_B64: ${{ secrets.OSS_CONFIDENTIAL_TERMS_B64 }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            export CONFIDENTIAL_GIT_RANGE="$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # A new branch or rewritten history has no trustworthy public base. Scan every
            # reachable commit instead of either failing on a missing object or checking only
            # the tip and allowing older newly-public commits to bypass the gate.
            export CONFIDENTIAL_GIT_RANGE="HEAD"
          else
            export CONFIDENTIAL_GIT_RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          python3 ../trusted/scripts/check-confidential-identifiers.py
      - name: Test candidate scanner without private configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        working-directory: candidate
        run: python3 scripts/test-confidential-identifiers.py

  build:
    needs: confidentiality-preflight
    if: needs.confidentiality-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # Named, so the failure can say what to do about it. NU1004 on a Dependabot branch means
      # the lock files were not regenerated, which is a chore rather than a defect -- and the
      # error NuGet prints for it does not mention the fix.
      - name: Restore
        run: |
          set -euo pipefail
          if ! dotnet restore --locked-mode; then
            echo "::error title=Lock files are out of step::dotnet restore --locked-mode failed. If this is a dependency bump, Dependabot cannot rewrite packages.lock.json under central package management. Run the 'Refresh lock files' workflow against ${{ github.head_ref || github.ref_name }}, then re-run these checks."
            exit 1
          fi
      - run: dotnet build --no-restore -c Release
      # Format is enforced by the build via EnforceCodeStyleInBuild. This catches
      # whitespace-only drift that the analyzers do not.
      - run: dotnet format --verify-no-changes --no-restore

      # Dependabot raises a PR; this fails the build. Without it a known-vulnerable
      # transitive package ships while the bump PR waits for review.
      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q -E '>\s+\S+\s+\S+\s+\S+\s+(Moderate|High|Critical)' vuln.txt && exit 1
          echo "no moderate-or-higher advisories"

  test:
    needs: confidentiality-preflight
    if: needs.confidentiality-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # Testcontainers needs a Docker daemon; ubuntu-latest has one.
      # Live tests are excluded here and run only from a maintainer-triggered workflow.
      - run: dotnet test -c Release --filter "Category!=Live" --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      # Reported, not gated — the script says why. In scripts/ rather than inline here, so it can
      # be run and changed without a workflow round trip, like the two doc checks below.
      - name: Report coverage
        if: always()
        run: python3 scripts/report-coverage.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: TestResults/

  consumer-floor:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - name: Pack the candidate packages
        run: dotnet pack LakeWright.slnx -c Release -o consumer-floor-packages -p:Version=1.1.2-ci.0
      - name: Verify every packed package has a publication order
        run: |
          python3 scripts/package-publish-order.py consumer-floor-packages 1.1.2-ci.0 > consumer-floor-packages/publish-order.txt
          packed=$(find consumer-floor-packages -maxdepth 1 -type f -name '*.1.1.2-ci.0.nupkg' | wc -l)
          ordered=$(wc -l < consumer-floor-packages/publish-order.txt)
          test "$packed" -eq "$ordered"
      - name: Run the net8 consumer floor
        run: |
          dotnet run --project tests/consumer-floor/consumer-floor.csproj \
            -p:LakeWrightVersion=1.1.2-ci.0 \
            -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/consumer-floor-packages"
          command -v grep >/dev/null || {
            echo "::error title=Consumer floor assertion unavailable::grep is required to enforce the persistence dependency boundary."
            exit 1
          }
          if grep -Eiq 'EntityFramework|Npgsql|PostgreSQL' tests/consumer-floor/obj/project.assets.json; then
              echo "::error title=Consumer floor leaked persistence dependencies::The net8 Embedding and Databricks path must not acquire EF Core, Npgsql, or PostgreSQL."
            exit 1
          fi
      - name: Exercise the packaged local verification tool
        run: |
          dotnet tool install --tool-path .lakewright-tool \
            --add-source "$GITHUB_WORKSPACE/consumer-floor-packages" \
            LakeWright.Tooling --version 1.1.2-ci.0
          .lakewright-tool/lakewright inspect-dashboard tests/assets/tooling-safe-dashboard.lvdash.json
          .lakewright-tool/lakewright verify-floor "$GITHUB_WORKSPACE/consumer-floor-packages" 1.1.2-ci.0

  docs:
    needs: confidentiality-preflight
    if: always() && needs.confidentiality-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
      - name: Explain external-fork documentation isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.actor != 'dependabot[bot]'
        run: echo "External fork scripts are not executed; the trusted Confidentiality workflow scans the change as data."
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        run: bash scripts/check-doc-links.sh
      # Links rot first; claims rot quietly. A re-read on 2026-08-05 found six claims describing
      # a repository that had moved on without them, two in the compliance mapping an assessor
      # reads first and one in the threat model. Review found the sixth after this check was
      # written and passing, which is why its rules match the subject rather than the sentence.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]'
        run: bash scripts/check-doc-claims.sh

  # Its own required check, so a skipped or filtered-out isolation suite fails
  # the build instead of passing quietly inside the general test job.
  tenant-isolation:
    needs: confidentiality-preflight
    if: needs.confidentiality-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "Category=TenantIsolation"

  bundle:
    needs: confidentiality-preflight
    if: needs.confidentiality-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9 # v1.14.1
      # `bundle validate` resolves against a live workspace, so it needs credentials
      # that a fork PR must never receive. Forks get schema validation only; a
      # maintainer runs the authenticated validation before merge.
      # `bundle schema` only prints the schema, so it has to be fed to a validator
      # against the actual file to check anything.
      # No working-directory here: git does not track empty directories, so `databricks/`
      # does not exist in the checkout until the bundle does, and a working-directory that
      # does not exist fails the job before the guard below can run.
      - name: Validate bundle against schema (no credentials)
        run: |
          if [ ! -f databricks/databricks.yml ]; then
            echo "No bundle yet; nothing to validate."
            exit 0
          fi
          pipx install check-jsonschema
          databricks bundle schema > /tmp/bundle.schema.json
          check-jsonschema --schemafile /tmp/bundle.schema.json databricks/databricks.yml

      - name: Validate against workspace
        if: |
          hashFiles('databricks/databricks.yml') != ''
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "No workspace credentials configured; skipping authenticated validation."
            exit 0
          fi
          databricks bundle validate -t dev
