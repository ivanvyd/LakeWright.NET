name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      # Format is enforced by the build via EnforceCodeStyleInBuild. This catches
      # whitespace-only drift that the analyzers do not.
      - run: dotnet format --verify-no-changes --no-restore

      # Dependabot raises a PR; this fails the build. Without it a known-vulnerable
      # transitive package ships while the bump PR waits for review.
      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q -E '>\s+\S+\s+\S+\s+\S+\s+(Moderate|High|Critical)' vuln.txt && exit 1
          echo "no moderate-or-higher advisories"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      # Testcontainers needs a Docker daemon; ubuntu-latest has one.
      # Live tests are excluded here and run only from a maintainer-triggered workflow.
      - run: dotnet test -c Release --filter "Category!=Live" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: TestResults/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-doc-links.sh

  # Its own required check, so a skipped or filtered-out isolation suite fails
  # the build instead of passing quietly inside the general test job.
  tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release --filter "Category=TenantIsolation"

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28 # v1.10.0
      # `bundle validate` resolves against a live workspace, so it needs credentials
      # that a fork PR must never receive. Forks get schema validation only; a
      # maintainer runs the authenticated validation before merge.
      # `bundle schema` only prints the schema, so it has to be fed to a validator
      # against the actual file to check anything.
      # No working-directory here: git does not track empty directories, so `databricks/`
      # does not exist in the checkout until the bundle does, and a working-directory that
      # does not exist fails the job before the guard below can run.
      - name: Validate bundle against schema (no credentials)
        run: |
          if [ ! -f databricks/databricks.yml ]; then
            echo "No bundle yet; nothing to validate."
            exit 0
          fi
          pipx install check-jsonschema
          databricks bundle schema > /tmp/bundle.schema.json
          check-jsonschema --schemafile /tmp/bundle.schema.json databricks/databricks.yml

      - name: Validate against workspace
        if: |
          hashFiles('databricks/databricks.yml') != ''
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "No workspace credentials configured; skipping authenticated validation."
            exit 0
          fi
          databricks bundle validate -t dev
