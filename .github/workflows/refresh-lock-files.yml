name: Refresh lock files

# Dependabot cannot do this itself.
#
# Under central package management it edits Directory.Packages.props, but it does not rewrite
# packages.lock.json -- and it cannot, because the CentralTransitive entries have to be resolved by
# NuGet, not pattern-matched. So every NuGet bump arrives with lock files that still name the old
# versions, and `dotnet restore --locked-mode` fails before anything builds:
#
#   error NU1004: Mistmatch between the requestedVersion of a lock file dependency marked as
#   CentralTransitive and the version specified in the central package management file.
#
# Run this workflow from the default branch, with the Dependabot bump branch as its input.
# The workflow refreshes that bump's lock files.
#
# GITHUB_TOKEN pushes do not trigger push workflows. After a changed push, approve pending PR
# workflows with 'Approve workflows to run'. If expected checks are absent, close and reopen
# the PR with your own identity. Rerunning older workflow runs does not test the new SHA.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Dependabot branch to refresh as input (run this workflow from the default branch), e.g. dependabot/nuget/microsoft-extensions-abc123
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-lock-files-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  resolve:
    # workflow_dispatch can select another ref. Only the default-branch workflow is trusted.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate the maintenance branch
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH"
          case "$BRANCH" in
            dependabot/nuget/*) ;;
            *)
              echo "::error::Only a dependabot/nuget/* branch can be refreshed."
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve immutable maintenance source
        id: source
        env:
          BRANCH: ${{ inputs.branch }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          source_sha=$(python3 scripts/refresh-lock-files.py resolve --remote "$REMOTE" --branch "$BRANCH")
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  refresh:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json

      # --force-evaluate is the whole point: it re-resolves rather than asserting the lock is right.
      - run: dotnet restore --force-evaluate
        working-directory: candidate

      # Prove the result before committing it. If locked-mode cannot restore what force-evaluate
      # just wrote, something is wrong that a commit would only bury.
      - run: dotnet restore --locked-mode
        working-directory: candidate
      - run: dotnet build --no-restore -c Release
        working-directory: candidate

      - name: Package lock data
        env:
          BRANCH: ${{ inputs.branch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          python3 trusted/scripts/refresh-lock-files.py pack --repository candidate --branch "$BRANCH" --base "$SOURCE_SHA" --payload "$RUNNER_TEMP/lock-refresh.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lock-refresh-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lock-refresh.json
          if-no-files-found: error
          retention-days: 1

  write:
    needs: [resolve, refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-refresh-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lock-data

      - name: Commit the refreshed lock files
        env:
          BRANCH: ${{ inputs.branch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 scripts/refresh-lock-files.py write --remote "$REMOTE" --branch "$BRANCH" --base "$SOURCE_SHA" --payload "$RUNNER_TEMP/lock-data/lock-refresh.json" --repository "$RUNNER_TEMP/lock-writer.git"
          cat <<'NOTE'
          If lock files were pushed:
            Approve pending PR workflows with 'Approve workflows to run'.
            If expected checks are absent, close and reopen the PR with your own identity.
            Rerunning older workflow runs does not test the new SHA.
          NOTE
