name: Release

on:
  # repository_dispatch always loads this workflow from the default branch.
  # A branch copy cannot grant itself release permissions or bypass the gates.
  repository_dispatch:
    types: [release]

permissions:
  contents: read

jobs:
  build-release-candidate:
    # Creating a repository_dispatch event requires write access. Release authority is narrower:
    # only the repository owner's event is allowed to acquire write and OIDC permissions.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate
    # A release that hangs holds a runner for six hours without publishing.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
      kind: ${{ steps.kind.outputs.value }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out the trusted release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      # A release tag says "this exact commit is what we published". Unsigned, that claim rests on
      # nobody having pushed a tag they should not have — and tag-push rights are usually wider than
      # release rights. Signed, it is checkable by anyone afterwards.
      #
      # Verification is asked of GitHub rather than done here on purpose: `git verify-tag` would
      # need the public key on the runner, and a key the runner supplies is a key an attacker who
      # controls the runner supplies. GitHub checks the signature against the keys registered to the
      # account, which is the thing this is meant to prove.
      #
      # Lightweight tags are refused before that: they are a pointer with no object to sign, so
      # `git tag v1.0.0` cannot be signed at all. It must be `git tag -s`.
      - name: Refuse an unsigned tag
        id: tag
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/validate-release-tag.py" "$REF_NAME"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")
          type=$(printf '%s' "$ref" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['type'])")
          sha=$(printf '%s' "$ref" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")

          if [ "$type" != "tag" ]; then
            echo "::error::$REF_NAME is a lightweight tag, which carries no signature. Use: git tag -s $REF_NAME -m '...'"
            exit 1
          fi

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
          printf '%s' "$tag_object" > "$RUNNER_TEMP/verified-tag-object.json"
          v=$(printf '%s' "$tag_object" | jq -r '.verification.verified, .verification.reason' | paste -sd' ' -)
          verified=${v%% *}; reason=${v##* }
          if [ "$verified" != "true" ]; then
            echo "::error::$REF_NAME is not a verified signed tag (reason: $reason). See docs/guides/releasing.md"
            exit 1
          fi
          target_type=$(printf '%s' "$tag_object" | jq -r '.object.type')
          commit_sha=$(printf '%s' "$tag_object" | jq -r '.object.sha')
          test "$target_type" = "commit"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tag_object_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "$REF_NAME is signed and verified by GitHub."

      # Only after GitHub authenticates the annotated tag do we fetch its tree.
      # The scanner still comes from the default branch; tagged code is data until
      # the private confidentiality gate has passed.
      - name: Fetch the verified release candidate as data
        working-directory: ${{ github.workspace }}
        env:
          COMMIT_SHA: ${{ steps.tag.outputs.commit_sha }}
        run: |
          mkdir candidate
          git -C candidate init --quiet
          git -C candidate remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C candidate fetch --no-tags origin "$COMMIT_SHA"
          git -C candidate checkout --detach --quiet "$COMMIT_SHA"

      - name: Test the trusted confidentiality scanner
        working-directory: trusted
        run: python3 scripts/test-confidential-identifiers.py
      - name: Scan verified release source and history before executing it
        env:
          CONFIDENTIAL_GIT_RANGE: HEAD^..HEAD
          OSS_CONFIDENTIAL_TERMS_B64: ${{ secrets.OSS_CONFIDENTIAL_TERMS_B64 }}
        run: |
          set -euo pipefail
          python3 ../trusted/scripts/check-confidential-identifiers.py "$RUNNER_TEMP/verified-tag-object.json"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: candidate/global.json

      # The tag is the single source of the version. Deriving it here rather than reading
      # VersionPrefix means a package can never claim a version the tag does not.
      - name: Derive version from the tag
        id: version
        env:
          REF_NAME: ${{ github.event.client_payload.tag }}
        run: echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ADR 0019: a stable tag is no longer refused. The compat promise for 1.x is a
      # SemVer minor + CHANGELOG migration note on any breaking change; the prerelease
      # guard in ADR 0010 still applies to a future 0.x branch but is removed for 1.x.
      # Build metadata is stripped before the prerelease check below so `1.0.0+exp-sha`
      # is read as stable.
      - name: Read whether the version is a prerelease
        id: kind
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          case "${VERSION%%+*}" in
            *-*) echo "value=prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "value=stable"    >> "$GITHUB_OUTPUT" ;;
          esac

      # A stable release must promote source that has already been tagged as a release candidate.
      # The packages are rebuilt for their stable SemVer identity, but the verified source commit
      # is identical: a stable tag must never be the first release-pipeline execution for code.
      - name: Require an identical release-candidate commit before stable publication
        if: steps.kind.outputs.value == 'stable'
        working-directory: ${{ github.workspace }}/candidate
        env:
          COMMIT_SHA: ${{ steps.tag.outputs.commit_sha }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          candidates=$(git tag --points-at "$COMMIT_SHA" --list "v${VERSION}-rc.*")
          test -n "$candidates" || {
            echo "::error::Stable v$VERSION must promote the same commit as a v$VERSION-rc.N tag."
            exit 1
          }
          echo "Promoting release-candidate tag(s): $candidates"

      - run: dotnet restore --locked-mode
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build --no-restore -c Release -p:Version="$VERSION"
      - run: dotnet test --no-build -c Release --filter "Category!=Live"
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack --no-build -c Release -o artifacts -p:Version="$VERSION"

      - name: Order every packed package for publication
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 ../trusted/scripts/package-publish-order.py artifacts "$VERSION" > artifacts/publish-order.txt
          packed=$(find artifacts -maxdepth 1 -type f -name "*.$VERSION.nupkg" | wc -l)
          ordered=$(wc -l < artifacts/publish-order.txt)
          echo "ordered $ordered of $packed package(s) for publication"
          test "$packed" -gt 0
          test "$packed" -eq "$ordered"

      # A tag that does not produce a package is a release with nothing in it, and both the
      # attestation and `gh release create` below would fail on an empty glob with a less
      # obvious message.
      - name: Confirm packages were produced
        run: |
          count=$(find artifacts -name '*.nupkg' | wc -l)
          echo "packed $count package(s)"
          test "$count" -gt 0

      # CycloneDX over the solution: one tool, matches the NuGet dependency graph.
      # actions/attest accepts either CycloneDX or SPDX, so this does not lock out
      # a consumer who asks for SPDX later.
      #
      # The flags are -fn/-F, not -f/--json. CycloneDX 6 renamed them, and the first
      # tag ever pushed failed here on "Unrecognized command or argument '-f'" —
      # the workflow had been written against an older CLI and never run.
      # Test projects are excluded because the SBOM should describe what ships.
      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX LakeWright.slnx             -o artifacts             -fn sbom.cyclonedx.json             -F Json             --exclude-test-projects             --set-version "$VERSION"

      # An SBOM that silently described nothing would still attest and still upload.
      - name: Confirm the SBOM has components
        run: |
          components=$(python3 -c "import json;print(len(json.load(open('artifacts/sbom.cyclonedx.json')).get('components',[])))")
          echo "SBOM lists $components component(s)"
          test "$components" -gt 0

      # The whole CHANGELOG was attached to every release, so each one repeated all the history
      # before it — and a tag pushed before its heading is renamed publishes notes that open with
      # "## [Unreleased]". This takes the section for the version being tagged, and fails when
      # there is not one, because notes for the wrong version are worse than a failed release.
      - name: Extract the release notes for this version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PY' > release-notes.md
          import re, sys
          requested = sys.argv[1]
          # Release candidates promote the same source as the stable tag. Their notes are the
          # prepared stable section, rather than a second RC-only section that would require a
          # commit between candidate and stable publication.
          stable = re.sub(r'-rc\.\d+(?:\+.*)?$', '', requested)
          versions = [requested] if stable == requested else [stable, requested]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          for version in versions:
              m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
              if m:
                  sys.stdout.write(m.group(1).strip())
                  break
          PY
          test -s release-notes.md || {
            echo "CHANGELOG.md has no matching stable or requested section for '$VERSION'."
            exit 1
          }

      # Run once, after every publishable file exists. The scanner checks tracked source, the tag
      # commit, binary package content and entry names, symbol packages, the SBOM, and release notes.
      # A missing or empty private denylist is an error, never a skipped release gate.
      - name: Scan every public release surface for confidential identifiers
        env:
          OSS_CONFIDENTIAL_TERMS_B64: ${{ secrets.OSS_CONFIDENTIAL_TERMS_B64 }}
        run: python3 ../trusted/scripts/check-confidential-identifiers.py artifacts release-notes.md

      # This immutable same-run artifact is the only input to the privileged publication job.
      # Candidate code never executes in that job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-candidate
          path: |
            candidate/artifacts/
            candidate/release-notes.md

  publish:
    needs: build-release-candidate
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    # NuGet can acknowledge an upload before its public flat-container index has
    # caught up. Its documented validation and indexing window is up to an hour,
    # so leave time to verify that a clean consumer can discover it.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: candidate
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC for provenance attestation and NuGet trusted publishing
      attestations: write
    steps:
      - name: Download the verified same-run release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-candidate
          path: candidate

      - name: Confirm the publication input is complete
        run: |
          test -s release-notes.md
          test -s artifacts/sbom.cyclonedx.json
          count=$(find artifacts -name '*.nupkg' | wc -l)
          echo "publishing $count package(s)"
          test "$count" -gt 0

      # Provenance is meaningful because Directory.Build.props makes the packages deterministic.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'candidate/artifacts/*.nupkg'

      - name: Confirm the verified tag has not moved before publication
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.build-release-candidate.outputs.tag_object_sha }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.client_payload.tag }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME" --jq '.object.sha')
          test "$current" = "$EXPECTED_TAG_OBJECT" || {
            echo "::error::$REF_NAME moved after signature verification."
            exit 1
          }

      # Publishing to NuGet is the only irreversible step: nuget.org unlists but never deletes.
      # Do it before creating a GitHub release, then make the GitHub release contingent on a
      # public restore endpoint confirming that consumers can actually acquire the packages.
      #
      # Publish every primary package and its matching symbol package. The trusted build job
      # derives the artifact list from the packed nuspec dependency graph, so internal package
      # roots precede their dependents and a new package cannot be packed, indexed, but skipped.
      # The V3 source is explicit rather than inherited from any NuGet.config.
      #
      # --skip-duplicate so re-running a release that failed after a partial push finishes
      # instead of erroring on the packages that already landed.
      # Trusted publishing: GitHub mints an OIDC token, nuget.org validates it against a policy
      # naming this owner, repository and workflow file, and returns an API key valid for one hour.
      # No key is stored anywhere, so there is none to leak, rotate, or forget to rotate — and the
      # `id-token: write` permission this needs was already on the job for provenance attestation.
      #
      # Requested here rather than earlier because the key expires in an hour and this is the step
      # that spends it.
      - name: Exchange an OIDC token for a short-lived NuGet key
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.build-release-candidate.outputs.tag_object_sha }}
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          REF_NAME: ${{ github.event.client_payload.tag }}
          VERSION: ${{ needs.build-release-candidate.outputs.version }}
        run: |
          set -o pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            # An unconfigured or lapsed trusted-publishing policy must fail the release rather
            # than create a GitHub release that claims a package version consumers cannot restore.
            # nuget.org deactivates a new policy if nothing publishes within seven days, so this
            # can start working and later stop without anything else changing.
            echo "::error::No NuGet trusted-publishing key; refusing to create an incomplete release."
            echo "::warning::Set the NUGET_USER repository variable and add a policy at nuget.org."
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME" --jq '.object.sha')
          test "$current" = "$EXPECTED_TAG_OBJECT" || {
            echo "::error::$REF_NAME moved after signature verification."
            exit 1
          }
          test -s artifacts/publish-order.txt
          : > push.log
          while IFS= read -r package_file; do
            case "$package_file" in
              LakeWright.*."$VERSION".nupkg) ;;
              *) echo "::error::Unexpected package name in publication order: $package_file."; exit 1 ;;
            esac
            primary="artifacts/$package_file"
            symbols="${primary%.nupkg}.snupkg"
            test -f "$primary" && test -f "$symbols" || {
              echo "::error::Missing publication artifact for $package_file."
              exit 1
            }
            dotnet nuget push "$primary" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate | tee -a push.log
            dotnet nuget push "$symbols" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate | tee -a push.log
          done < artifacts/publish-order.txt

          # --skip-duplicate turns a 409 into a warning, which is what makes a resumed release
          # work — and also what would let a re-tagged version look published when nuget.org is
          # still serving the old bytes. Surface it rather than leaving it in a collapsed log.
          if grep -qi 'already exists\|conflict' push.log; then
            echo "::warning::At least one package already existed on nuget.org and was not republished."
          fi

      # A successful upload is not the same as a package that consumers can restore:
      # nuget.org indexes packages asynchronously. Check the public flat-container
      # index, which is the feed endpoint the restore client consumes. A timeout is a
      # failed release: a rerun can resume the immutable NuGet upload with --skip-duplicate,
      # but a GitHub release must not be created until consumers can restore it.
      - name: Verify NuGet public availability
        env:
          VERSION: ${{ needs.build-release-candidate.outputs.version }}
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("${package%.$VERSION.nupkg}")
          done < <(find artifacts -maxdepth 1 -type f -name '*.nupkg' -printf '%f\n' | sort)

          # NuGet documents validation and indexing as taking up to one hour. Poll
          # the endpoint a fresh restore consumes throughout that full window.
          for attempt in $(seq 1 60); do
            missing=()
            for package in "${packages[@]}"; do
              package_id=${package,,}
              index="https://api.nuget.org/v3-flatcontainer/$package_id/index.json"
              if ! curl --fail --silent --show-error "$index" | \
                python3 -c 'import json, sys; raise SystemExit(0 if sys.argv[1] in json.load(sys.stdin).get("versions", []) else 1)' \
                  "$VERSION"; then
                missing+=("$package")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All ${#packages[@]} packages are publicly available from nuget.org."
              exit 0
            fi

            echo "Attempt $attempt of 60: waiting for NuGet indexing of: ${missing[*]}"
            if [ "$attempt" -lt 60 ]; then
              sleep 60
            fi
          done

          echo "::error::NuGet accepted the upload, but the public flat-container index did not list $VERSION within its documented one-hour validation window. Missing: ${missing[*]}"
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-release-candidate.outputs.version }}
          REF_NAME: ${{ github.event.client_payload.tag }}
          KIND: ${{ needs.build-release-candidate.outputs.kind }}
        run: |
          # A prerelease label means a pre-release under SemVer. gh does not infer that, so a
          # tag like 1.0.0-rc.1 would otherwise publish as an ordinary release. The
          # classification is shared with the (now-removed) prerelease guard so the same
          # version reads the same way in both places.
          prerelease=""
          if [ "$KIND" = "prerelease" ]; then
            prerelease="--prerelease"
          fi

          # This job intentionally receives only the immutable candidate artifact, not a checkout.
          # Give gh the repository explicitly instead of asking it to infer one from a missing .git.
          gh release create "$REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$REF_NAME" \
            --notes-file release-notes.md \
            $prerelease \
            artifacts/*.nupkg artifacts/sbom.cyclonedx.json
