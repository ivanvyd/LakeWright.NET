name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC for provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # SourceLink and version derivation need history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # The tag is the single source of the version. Deriving it here rather than reading
      # VersionPrefix means a package can never claim a version the tag does not.
      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ADR 0010: packages publish with a prerelease suffix, so `dotnet add package` needs
      # --prerelease and the version string carries the instability warning at the point of use.
      # A stable tag would push a package that reads as a commitment to an API that is still
      # moving, and nuget.org unlists but never deletes. Refusing the tag is the only cheap
      # moment to catch it.
      #
      # Build metadata is stripped before the test. SemVer puts the prerelease label between the
      # hyphen and the plus, so `1.0.0+exp-sha.5114f85` is a *stable* version that nonetheless
      # contains a hyphen: a bare `*-*` test passes it and publishes a permanent stable 1.0.0.
      - name: Refuse a stable version
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "${VERSION%%+*}" in
            *-*) echo "prerelease: $VERSION" ;;
            *)   echo "Tag $REF_NAME carries no prerelease label. See ADR 0010."; exit 1 ;;
          esac

      - run: dotnet restore --locked-mode
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build --no-restore -c Release -p:Version="$VERSION"
      - run: dotnet test --no-build -c Release --filter "Category!=Live"
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack --no-build -c Release -o artifacts -p:Version="$VERSION"

      # A tag that does not produce a package is a release with nothing in it, and both the
      # attestation and `gh release create` below would fail on an empty glob with a less
      # obvious message.
      - name: Confirm packages were produced
        run: |
          count=$(find artifacts -name '*.nupkg' | wc -l)
          echo "packed $count package(s)"
          test "$count" -gt 0

      # CycloneDX over the solution: one tool, matches the NuGet dependency graph.
      # actions/attest accepts either CycloneDX or SPDX, so this does not lock out
      # a consumer who asks for SPDX later.
      #
      # The flags are -fn/-F, not -f/--json. CycloneDX 6 renamed them, and the first
      # tag ever pushed failed here on "Unrecognized command or argument '-f'" —
      # the workflow had been written against an older CLI and never run.
      # Test projects are excluded because the SBOM should describe what ships.
      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX LakeWright.slnx             -o artifacts             -fn sbom.cyclonedx.json             -F Json             --exclude-test-projects             --set-version "$VERSION"

      # An SBOM that silently described nothing would still attest and still upload.
      - name: Confirm the SBOM has components
        run: |
          components=$(python3 -c "import json;print(len(json.load(open('artifacts/sbom.cyclonedx.json')).get('components',[])))")
          echo "SBOM lists $components component(s)"
          test "$components" -gt 0

      # Provenance is only meaningful because Directory.Build.props sets
      # Deterministic and ContinuousIntegrationBuild: the artifact can be rebuilt
      # and compared.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: 'artifacts/*.nupkg'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: artifacts/

      # The whole CHANGELOG was attached to every release, so each one repeated all the history
      # before it — and a tag pushed before its heading is renamed publishes notes that open with
      # "## [Unreleased]". This takes the section for the version being tagged, and fails when
      # there is not one, because notes for the wrong version are worse than a failed release.
      - name: Extract the release notes for this version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PY' > release-notes.md
          import re, sys
          version = re.escape(sys.argv[1])
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{version}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          sys.stdout.write(m.group(1).strip() if m else "")
          PY
          test -s release-notes.md || {
            echo "CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A prerelease label means a pre-release under SemVer. gh does not infer that, so an RC
          # tag would otherwise publish as an ordinary release. Build metadata is stripped first,
          # for the reason the "Refuse a stable version" step gives.
          prerelease=""
          case "${VERSION%%+*}" in *-*) prerelease="--prerelease" ;; esac

          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes-file release-notes.md \
            $prerelease \
            artifacts/*.nupkg artifacts/sbom.cyclonedx.json

      # Last, because it is the only step that cannot be undone: nuget.org unlists but never
      # deletes. Everything before this is recoverable by deleting a tag and a release.
      #
      # Pushing the .nupkg also pushes the .snupkg beside it — the symbol package follows the
      # primary one automatically when both are in the same folder, which `dotnet pack -o
      # artifacts` guarantees. That only works against the V3 index, so the source URL is
      # explicit rather than inherited from any NuGet.config.
      #
      # --skip-duplicate so re-running a release that failed after a partial push finishes
      # instead of erroring on the packages that already landed.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            # A warning rather than a log line: a rotated-and-not-replaced key would otherwise
            # let every tagged release report success while publishing nothing.
            echo "::warning::No NUGET_API_KEY configured; packages are on the GitHub release only."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate | tee push.log

          # --skip-duplicate turns a 409 into a warning, which is what makes a resumed release
          # work — and also what would let a re-tagged version look published when nuget.org is
          # still serving the old bytes. Surface it rather than leaving it in a collapsed log.
          if grep -qi 'already exists\|conflict' push.log; then
            echo "::warning::At least one package already existed on nuget.org and was not republished."
          fi
