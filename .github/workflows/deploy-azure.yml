name: Deploy to Azure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

# Least privilege by default. The deploy job requests OIDC at runtime.
permissions:
  contents: read

# A hung job holds a runner; both jobs have explicit caps.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the Bicep CLI via the Azure CLI, which arm-deploy already requires.
      # azure/setup-bicep is not a public action, so we install the CLI tool directly. The
      # latest version of the Bicep CLI is what az bicep build resolves to.
      - name: Set up Bicep
        run: az bicep install

      - name: Build Bicep
        run: az bicep build --file infra/azure-container-apps/main.bicep --outfile bicep.json

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    # PostgreSQL Flexible Server creation can take 10-15 minutes; 30 was a thin margin.
    # 60 is generous but not a problem if the deploy is fast.
    timeout-minutes: 60
    # The deploy step is gated by a required-reviewer approval on the chosen environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The deploy step needs the Bicep CLI for arm-deploy to resolve the template. Same
      # one-liner as the validate job; az bicep install is idempotent.
      - name: Set up Bicep
        run: az bicep install

      - name: Azure login via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A parameters file, not a space-separated `name=value` string: the secrets then never sit in
      # the action's argument list, and a password containing a space or `=` cannot split the list.
      # The file lives in the runner's temp directory, which is discarded with the job.
      - name: Write deployment parameters
        id: parameters
        env:
          DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
          POSTGRES_ADMIN_LOGIN: ${{ secrets.POSTGRES_ADMIN_LOGIN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/main.parameters.json"
          umask 077
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: {
              databricksWorkspaceUrl: { value: env.DATABRICKS_WORKSPACE_URL },
              databricksCatalog: { value: env.DATABRICKS_CATALOG },
              postgresAdminLogin: { value: env.POSTGRES_ADMIN_LOGIN },
              postgresAdminPassword: { value: env.POSTGRES_ADMIN_PASSWORD },
              postgresAppPassword: { value: env.POSTGRES_APP_PASSWORD }
            }
          }' > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Deploy reference infrastructure
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploymentMode: Incremental
          template: infra/azure-container-apps/main.bicep
          parameters: ${{ steps.parameters.outputs.file }}
          failOnStdErr: true
