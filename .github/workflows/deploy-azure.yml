name: Deploy to Azure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

# Least privilege by default. The deploy job requests OIDC at runtime.
permissions:
  contents: read

# A hung job holds a runner; both jobs have explicit caps.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the Bicep CLI via the Azure CLI, which arm-deploy@v1 already requires.
      # azure/setup-bicep is not a public action, so we install the CLI tool directly. The
      # latest version of the Bicep CLI is what az bicep build resolves to.
      - name: Set up Bicep
        run: az bicep install

      - name: Build Bicep
        run: az bicep build --file infra/azure-container-apps/main.bicep --outfile bicep.json

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # PostgreSQL Flexible Server creation can take 10-15 minutes; 30 was a thin margin.
    # 60 is generous but not a problem if the deploy is fast.
    timeout-minutes: 60
    # The deploy step is gated by a required-reviewer approval on the chosen environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The deploy step needs the Bicep CLI for arm-deploy@v1 to resolve the template. Same
      # one-liner as the validate job; az bicep install is idempotent.
      - name: Set up Bicep
        run: az bicep install

      - name: Azure login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy reference infrastructure
        uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06 # v1
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/azure-container-apps/main.bicep
          parameters: databricksWorkspaceUrl=${{ secrets.DATABRICKS_WORKSPACE_URL }} databricksCatalog=${{ secrets.DATABRICKS_CATALOG }} postgresAdminLogin=${{ secrets.POSTGRES_ADMIN_LOGIN }} postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          fail-on-warnings: true
