name: Deploy to Azure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

# Least privilege by default. The deploy job requests OIDC at runtime.
permissions:
  contents: read

# A hung job holds a runner; both jobs have explicit caps.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Bicep build only — no Azure login, no deploy. The template compiles against the public
      # Bicep schema; a future deploy uses az CLI with OIDC.
      - name: Set up Bicep
        uses: azure/setup-bicep@v3
        with:
          version: latest

      - name: Build Bicep
        run: az bicep build --file infra/azure-container-apps/main.bicep --outfile bicep.json

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy step is gated by a required-reviewer approval on the chosen environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bicep
        uses: azure/setup-bicep@v3
        with:
          version: latest

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy reference infrastructure
        uses: azure/arm-deploy@v1
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/azure-container-apps/main.bicep
          parameters: databricksWorkspaceUrl=${{ secrets.DATABRICKS_WORKSPACE_URL }} databricksCatalog=${{ secrets.DATABRICKS_CATALOG }} postgresAdminLogin=${{ secrets.POSTGRES_ADMIN_LOGIN }} postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          fail-on-warnings: true
