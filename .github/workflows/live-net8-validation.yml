name: Live net8 validation

on:
  workflow_dispatch:
    inputs:
      run_genie:
        description: Run the optional billable Genie conversation validation.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    # workflow_dispatch can select any ref. Only the default branch's copy runs this. Because a
    # dispatched branch supplies its own copy of this file, the binding control is the environment:
    # a deployment-branch rule limited to the default branch, and an Entra federated credential
    # whose subject names this environment (docs/decisions/0006). No client secret is stored.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: live-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      # DefaultAzureCredential reaches the workspace through this Azure CLI session.
      - name: Azure login via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Run the net8 workspace validation
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          LAKEWRIGHT_WAREHOUSE_ID: ${{ secrets.LAKEWRIGHT_WAREHOUSE_ID }}
          LAKEWRIGHT_CATALOG: ${{ secrets.LAKEWRIGHT_CATALOG }}
          LAKEWRIGHT_SCHEMA: ${{ secrets.LAKEWRIGHT_SCHEMA }}
          LAKEWRIGHT_LIVE_TENANT_ID: ${{ secrets.LAKEWRIGHT_LIVE_TENANT_ID }}
          LAKEWRIGHT_GENIE_SPACE_ID: ${{ inputs.run_genie && secrets.LAKEWRIGHT_GENIE_SPACE_ID || '' }}
          LAKEWRIGHT_GENIE_PROMPT: ${{ secrets.LAKEWRIGHT_GENIE_PROMPT }}
        run: dotnet run --project tests/live-net8/LiveNet8.csproj -c Release
