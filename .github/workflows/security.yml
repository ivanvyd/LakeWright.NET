name: Security

on:
  pull_request:
  push:
    branches: [main]
  # So a scan can be run on demand rather than only on a push or the weekly cron. The gap that
  # showed the need: the visibility gate below evaluates per run, so after the repository went
  # public the last run still showed all three jobs skipped, and there was no way to ask for a
  # fresh one.
  workflow_dispatch:
  schedule:
    # CodeQL and Scorecard find things that were not findings when the code merged,
    # because the advisory database moves. Without this trigger they only ever see
    # the code at merge time.
    - cron: '17 6 * * 1'

permissions:
  contents: read

# CodeQL, dependency review and Scorecard are free on public repositories and need GitHub Advanced
# Security on private ones. The gate is on visibility rather than removed, so that a fork kept
# private does not get three permanently red checks — a permanently red check trains people to
# ignore red checks. The repository went public on 2026-08-01 and all three now run here.
jobs:
  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          # A copyleft dependency would make the Apache-2.0 promise in the README false.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  scorecard:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: scorecard.sarif
